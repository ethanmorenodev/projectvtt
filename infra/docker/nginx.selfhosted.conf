# nginx del despliegue self-hosted (compose.selfhosted.yml): sirve la web
# estática y hace proxy de /api y /hubs hacia la API. El cliente web y la
# API quedan en el mismo origen, así que no hace falta CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Límite coherente con el de subida de mapas del servidor (10 MiB).
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Monitorización pública (ADR-026): sin esto, nginx serviría el SPA en
    # /health y /health/ready, ocultando el estado real del backend.
    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # SignalR: el hub necesita upgrade a WebSocket y timeouts largos.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: todo lo que no es un fichero se resuelve con index.html.
    location / {
        try_files $uri /index.html;
    }
}
