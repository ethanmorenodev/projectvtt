name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/ProjectVTT.slnx
      - name: Restore tools (dotnet-ef)
        run: dotnet tool restore
      - name: Build
        run: dotnet build backend/ProjectVTT.slnx --no-restore --nologo
      - name: Test
        run: dotnet test backend/ProjectVTT.slnx --no-build --nologo
      - name: Check model/migration drift
        run: dotnet ef migrations has-pending-model-changes --project backend/Api --startup-project backend/Api

  web:
    name: Web (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  desktop:
    name: Escritorio Godot (build C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build apps/desktop/ProjectVTT.Desktop.csproj --nologo

  deploy-smoke:
    name: Smoke de despliegue self-hosted (BD vacía)
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dotnet-ef
        run: dotnet tool restore
      - name: Crear .env de CI (credencial local, no secreto)
        run: |
          cat > infra/docker/.env <<'EOF'
          POSTGRES_USER=projectvtt
          POSTGRES_PASSWORD=ci-local-only
          POSTGRES_DB=projectvtt
          WEB_PORT=80
          EOF
      - name: Generar script idempotente de migraciones
        run: |
          dotnet ef migrations script --project backend/Api --startup-project backend/Api \
            --idempotent --output /tmp/pv-migrations.sql
      - name: Arrancar PostgreSQL y aplicar migraciones
        run: |
          COMPOSE="docker compose --env-file infra/docker/.env -f infra/docker/compose.selfhosted.yml"
          $COMPOSE up -d --build postgres
          for i in $(seq 1 36); do
            status=$(docker inspect --format '{{.State.Health.Status}' "$($COMPOSE ps -q postgres)" 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "PostgreSQL no alcanzó healthy en 180s" >&2
              exit 1
            fi
            sleep 5
          done
          $COMPOSE exec -T postgres psql -U projectvtt -d projectvtt -v ON_ERROR_STOP=1 -f - < /tmp/pv-migrations.sql
      - name: Arrancar API y web; verificar health, métricas y seed
        run: |
          COMPOSE="docker compose --env-file infra/docker/.env -f infra/docker/compose.selfhosted.yml"
          $COMPOSE up -d --build api web
          for i in $(seq 1 30); do
            if curl -fsS http://localhost/health >/dev/null && curl -fsS http://localhost/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "/health y /health/ready no respondieron en 90s" >&2
              exit 1
            fi
            sleep 3
          done
          curl -fsS http://localhost/health
          echo
          curl -fsS http://localhost/health/ready
          echo
          metrics=$(curl -fsS http://localhost/metrics)
          printf '%s\n' "$metrics" | grep -q 'process_uptime_seconds'
          register=$(curl -fsS -X POST http://localhost/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"userName":"ci_smoke","password":"CiPass123!"}')
          token=$(printf '%s' "$register" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          items=$(curl -fsS -H "Authorization: Bearer $token" \
            'http://localhost/api/v1/content/items?system=dnd5e')
          count=$(printf '%s' "$items" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d) if isinstance(d,list) else 0)')
          if [ "$count" -eq 0 ]; then
            echo "El seed de SRD no devolvió ítems" >&2
            exit 1
          fi
          echo "Ítems dnd5e visibles: $count"
      - name: Volcar logs del compose si falla
        if: failure()
        run: docker compose --env-file infra/docker/.env -f infra/docker/compose.selfhosted.yml logs --no-color
      - name: Limpiar contenedores y volúmenes
        if: always()
        # No enmascarar el fallo original si el job murió antes de crear .env.
        run: docker compose --env-file infra/docker/.env -f infra/docker/compose.selfhosted.yml down -v || true
